<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATEM Control - Landing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px 20px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2em;
            margin-bottom: 50px;
            opacity: 0.9;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 300px;
            height: 80px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            color: white;
            text-decoration: none;
            font-size: 1.4em;
            font-weight: bold;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.4);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .icon {
            font-size: 1.5em;
        }

        @media (max-width: 400px) {
            .btn {
                width: 280px;
                height: 70px;
                font-size: 1.2em;
            }
            
            h1 {
                font-size: 2.5em;
            }
        }

        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.9em;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 ATEM Control</h1>
        <p class="subtitle">Professional Video Switcher Control</p>
        
        <div class="buttons">
            <a href="/editor" class="btn">
                <span class="icon">🎛</span>
                <span>Editor</span>
            </a>
            
            <a href="/operator" class="btn">
                <span class="icon">🎥</span>
                <span>Operator</span>
            </a>
            
            <a href="/settings" class="btn">
                <span class="icon">⚙️</span>
                <span>Settings</span>
            </a>
        </div>
    </div>
    
    <div class="footer">
        ATEM Control Web App v1.0
    </div>
</body>
</html>
