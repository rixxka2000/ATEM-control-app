<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATEM Control - Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a1a;
            color: white;
            min-height: 100vh;
        }

        .header {
            background: #2d2d2d;
            padding: 20px;
            border-bottom: 2px solid #444;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .atem-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
        }

        .status-dot.connected {
            background: #44ff44;
        }

        .timer {
            font-size: 1.5em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        .timer.warning {
            color: #ff4444;
        }

        .back-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .main-content {
            margin-top: 140px;
            padding: 20px;
        }

        .camera-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .camera-btn {
            aspect-ratio: 16/9;
            border: 3px solid #555;
            border-radius: 8px;
            background: #333;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            user-select: none;
        }

        .camera-btn:hover {
            transform: scale(1.05);
            border-color: #777;
        }

        .camera-btn:active {
            transform: scale(0.98);
        }

        .camera-btn.idle {
            background: #333;
            border-color: #555;
        }

        .camera-btn.preview {
            background: #2d5016;
            border-color: #44aa00;
            box-shadow: 0 0 15px rgba(68, 170, 0, 0.3);
        }

        .camera-btn.live {
            background: #5d1616;
            border-color: #cc0000;
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.3);
        }

        .camera-btn.hidden {
            display: none;
        }

        .camera-number {
            font-size: 1.2em;
        }

        .instructions {
            text-align: center;
            margin: 30px 0;
            opacity: 0.7;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .camera-grid {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
                gap: 10px;
            }
            
            .header {
                padding: 15px;
            }
            
            .main-content {
                margin-top: 140px;
                padding: 15px;
            }
            
            .timer {
                font-size: 1.2em;
            }
        }

        @media (max-width: 480px) {
            .camera-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .status-bar {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
            
            .main-content {
                margin-top: 160px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="status-bar">
            <div class="atem-status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Disconnected</span>
            </div>
            
            <div class="timer" id="timer" style="display: none;">00:00</div>
            
            <a href="/" class="back-btn">← Back to Home</a>
        </div>
        
        <div class="instructions">
            Tap once for Preview (Green) • Tap again for Live (Red) • Must preview before going live
        </div>
    </div>

    <div class="main-content">
        <div class="camera-grid" id="cameraGrid">
            <!-- Camera buttons will be generated here -->
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let appState = {};
        let timerInterval = null;

        // DOM elements
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const timer = document.getElementById('timer');
        const cameraGrid = document.getElementById('cameraGrid');

        // Initialize
        socket.on('stateUpdate', (state) => {
            appState = state;
            updateCameraGrid();
            updateTimer();
        });

        socket.on('atemStatus', (status) => {
            updateATEMStatus(status.connected);
        });

        function updateATEMStatus(connected) {
            if (connected) {
                statusDot.classList.add('connected');
                statusText.textContent = 'ATEM Connected';
            } else {
                statusDot.classList.remove('connected');
                statusText.textContent = 'ATEM Disconnected';
            }
        }

        function updateCameraGrid() {
            cameraGrid.innerHTML = '';
            
            for (let i = 1; i <= appState.numCameras; i++) {
                const btn = document.createElement('button');
                btn.className = `camera-btn ${appState.cameras[i] || 'idle'}`;
                
                // Use custom name if available, otherwise use number
                const displayName = (appState.cameraNames && appState.cameraNames[i]) || i;
                btn.innerHTML = `<span class="camera-number">${displayName}</span>`;
                btn.onclick = () => handleCameraClick(i);
                
                // Hide inactive cameras
                if (appState.activeCameras && !appState.activeCameras.includes(i)) {
                    btn.classList.add('hidden');
                }
                
                cameraGrid.appendChild(btn);
            }
        }

        function handleCameraClick(camera) {
            const currentState = appState.cameras[camera];
            
            if (currentState === 'idle') {
                // Go to preview
                socket.emit('cameraAction', { camera, action: 'preview' });
            } else if (currentState === 'preview') {
                // Go to live
                socket.emit('cameraAction', { camera, action: 'live' });
            }
            // If live, do nothing (could add logic to go back to idle if needed)
        }

        function updateTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            
            if (appState.live && appState.liveStartTime) {
                timer.style.display = 'block';
                startTimer();
            } else {
                timer.style.display = 'none';
            }
        }

        function startTimer() {
            function updateTimerDisplay() {
                const elapsed = Date.now() - appState.liveStartTime;
                const minutes = Math.floor(elapsed / 60000);
                const seconds = Math.floor((elapsed % 60000) / 1000);
                
                const display = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                timer.textContent = display;
                
                // Turn red after 5 minutes
                if (minutes >= 5) {
                    timer.classList.add('warning');
                } else {
                    timer.classList.remove('warning');
                }
            }
            
            updateTimerDisplay();
            timerInterval = setInterval(updateTimerDisplay, 1000);
        }
    </script>
</body>
</html>
